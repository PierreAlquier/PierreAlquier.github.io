{% assign t = site.data.talks %}
<h1 class="page-title">Talks</h1>

<section class="block">
  <h2>Forthcoming</h2>
  <ol class="list">
  {% for x in t.upcoming %}{% include talk.html %}{% endfor %}
  </ol>
</section>

<section class="block">
  <h2>Past talks</h2>
  {% if t.note %}<p class="muted">{{ t.note }}</p>{% endif %}
  <ol class="list">
  {% for x in t.past %}{% include talk.html %}{% endfor %}
  </ol>
</section>
