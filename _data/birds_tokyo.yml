# BIRDS OF TOKYO (hidden page birds2.html, linked from the Birds page) — one entry per species, in display order.
# Each: name, name_ja, note (optional), photos: list of {src, caption (optional)}.

title: Herons of Tokyo
intro: Herons in Tokyo can be seen anywhere. They fish in all the rivers, even in the city center, and are easily approachable, at least the grey heron, the great egret, the little egret and the black-crowned night heron. If you leave the city center, you can meet other herons that are a little shier. I bought a camera during the epidemic and decided to try to take photos of them. If you want to know more about the places where I took these photos, or if you know some good places, please don't hesitate to contact me! Also, there are a few videos of the same birds in my [YouTube Channel](https://www.youtube.com/@PierreAlquierVideos).
