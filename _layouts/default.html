<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.data.profile.name }}</title>
<meta name="description" content="{{ site.data.profile.name }}, {{ site.data.profile.position }}, ESSEC Business School Asia-Pacific">
<link rel="icon" href="pierrealquier.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="index.html">{{ site.data.profile.name }}</a>
    <nav class="menu" aria-label="Main">
      {% for item in site.data.nav %}<a href="{{ item.url }}"{% if page.nav == item.id %} aria-current="page"{% endif %}>{{ item.label }}</a>{% endfor %}
    </nav>
  </div>
</header>
<main id="main" class="wrap page">
{{ content }}
</main>
<footer class="wrap footer">
  <span>© {{ site.data.profile.name }}</span>
  <a href="#main">Back to top ↑</a>
</footer>
</body>
</html>
